<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Temporizador Pomodoro desarrollado mediante Spec Driven Development.">
    <title>25:00 - Work | Pomodoro</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body data-mode="work">
    <header class="site-header">
      <h1>Pomodoro</h1>
      <p>Spec Driven Development</p>
    </header>

    <main>
      <section class="timer-card" aria-labelledby="timer-heading">
        <h2 id="timer-heading">Sesión actual</h2>

        <p class="mode-label">Modo</p>
        <p id="mode" class="mode" aria-label="Modo actual">Work</p>

        <p
          id="timer"
          class="timer"
          aria-label="Tiempo restante: 25 minutos y 0 segundos"
        >25:00</p>

        <div class="controls" role="group" aria-label="Controles del temporizador">
          <button id="start-button" class="button button-primary" type="button">Iniciar</button>
          <button id="pause-button" class="button" type="button" aria-disabled="true">Pausar</button>
          <button id="reset-button" class="button" type="button">Reiniciar</button>
        </div>

        <p id="counter" class="counter">Pomodoros completados: 0</p>

        <div
          id="notification"
          class="notification"
          role="status"
          aria-live="polite"
          aria-atomic="true"
        ></div>
      </section>
    </main>
  </body>
</html>
